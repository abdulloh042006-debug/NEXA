# NEXA detekt configuration.
# Applied with buildUponDefaultConfig = true: this file only overrides the defaults.
# ktlint runs as the detekt-formatting ruleset (ANDROID_ENGINEERING_SPECIFICATION
# §19.2) and takes its style from .editorconfig.

build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 80
  LongParameterList:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 15

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*|[A-Z][_A-Z0-9]*'

style:
  MagicNumber:
    ignoreAnnotated: ['Composable']
    ignorePropertyDeclaration: true
    ignoreEnums: true
  MaxLineLength:
    maxLineLength: 120
  UnusedPrivateMember:
    ignoreAnnotated: ['Composable']
