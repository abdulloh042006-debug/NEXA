# NEXA version catalog — single source of truth for every dependency and plugin
# (ANDROID_ENGINEERING_SPECIFICATION §2, §3).
# Compatibility matrix: AGP 8.7.x <-> Gradle 8.11.x <-> Kotlin 2.1.0 <-> KSP 2.1.0-1.0.29.

[versions]
agp = "8.7.3"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"

androidxActivityCompose = "1.9.3"
androidxBenchmark = "1.3.3"
androidxComposeBom = "2024.12.01"
androidxCoreKtx = "1.15.0"
androidxDatastore = "1.1.1"
androidxLifecycle = "2.8.7"
androidxNavigation = "2.8.5"
androidxRoom = "2.6.1"
androidxTestExtJunit = "1.2.1"
androidxUiautomator = "2.3.0"

hilt = "2.53.1"
javaxInject = "1"
konsist = "0.16.1"
kotlinxCoroutines = "1.9.0"
timber = "5.0.1"
wire = "5.1.0"

junit = "4.13.2"

detekt = "1.23.7"
spotless = "6.25.0"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivityCompose" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "androidxBenchmark" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCoreKtx" }
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "androidxDatastore" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "androidxRoom" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "androidxRoom" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "androidxRoom" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "androidxUiautomator" }

detekt-formatting = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javaxInject" }

konsist = { group = "com.lemonappdev", name = "konsist", version.ref = "konsist" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

wire-runtime = { group = "com.squareup.wire", name = "wire-runtime", version.ref = "wire" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

# Build-logic only: gradle plugin artifacts consumed by convention plugins.
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
wire = { id = "com.squareup.wire", version.ref = "wire" }

# Convention plugins (build-logic) — the §4.1 module type system + shared capabilities.
nexa-android-api = { id = "nexa.android.api" }
nexa-android-application = { id = "nexa.android.application" }
nexa-android-compose = { id = "nexa.android.compose" }
nexa-android-feature = { id = "nexa.android.feature" }
nexa-android-impl = { id = "nexa.android.impl" }
nexa-android-library = { id = "nexa.android.library" }
nexa-android-platform = { id = "nexa.android.platform" }
nexa-hilt = { id = "nexa.hilt" }
nexa-kotlin-domain = { id = "nexa.kotlin.domain" }
nexa-room = { id = "nexa.room" }
